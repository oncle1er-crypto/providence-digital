name: Cleanup Admin Once V2

on:
  push:
    branches:
      - feature/seo-admin-vercel-sync
    paths:
      - .github/workflows/cleanup-admin-once-v2.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/seo-admin-vercel-sync
      - name: Run cleanup script
        run: python scripts/cleanup_admin_once.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx
          git commit -m "CMS: retirer le bootstrap admin temporaire"
          git push origin HEAD:feature/seo-admin-vercel-sync
