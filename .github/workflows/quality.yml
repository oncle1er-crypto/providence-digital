name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/seo-admin-vercel

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build for Vercel
        run: bun run build
        env:
          VERCEL: "1"

      - name: TypeScript
        run: bunx tsc --noEmit
